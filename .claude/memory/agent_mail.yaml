# Agent Mail — kênh truyền tin giữa agents/sessions
# Đọc bởi /mail-* commands, SessionStart hook
# Git-committable, chia sẻ giữa sessions và team members
# Chỉ cần khi multi-dev (D4=multi-dev)

# ── Mailbox ────────────────────────────────────────────────────────
mailbox: []
